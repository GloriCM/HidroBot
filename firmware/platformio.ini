; HidroBot - firmware del ESP32
; Abre esta carpeta en Cursor/VS Code con la extension PlatformIO IDE.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    ; Textos del portal en español (visible también al compilar WiFiManager)
    -Iinclude
    -DWM_STRINGS_FILE=\"wm_strings_hidrobot.h\"
    ; Sin página de ayuda (ahorra Flash)
    -DWM_NOHELP
lib_deps =
    links2004/WebSockets
    hideakitai/MQTTPubSubClient
    bblanchon/ArduinoJson@^7
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    tzapu/WiFiManager
